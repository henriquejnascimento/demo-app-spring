server:
  port: 8080

logging:
  level:
    com.henriquenascimento.demo: DEBUG
    org.flywaydb.core: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type: TRACE

spring:
  profiles:
    active: dev
  application:
    name: demo-app-spring
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      schema: DEV_DEMO
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        show_sql: true
        format_sql: true
  flyway:
    enabled: true
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    locations: classpath:/db/migration/oracle
    baseline-on-migrate: true
    schemas:
      - DEV_DEMO
  output:
    ansi:
      enabled: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

demo-app-spring:
  file:
    upload:
      enable: true
      base-path: upload/